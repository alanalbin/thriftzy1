services:
  - type: web
    name: thriftzy-store
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: thriftzy-data
      mountPath: /opt/render/project/src/server
      sizeGB: 1

